<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Test Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-container">
        <h1>Share Management</h1>
        
        <div class="queue-status-container">
            <div id="queueStatus">
                <div class="queue-info">Queue Length: <span class="queue-length">0</span></div>
                <div class="queue-info">Processing: <span class="processing">None</span></div>
            </div>
        </div>

        <div class="controls-section">
            <div class="input-container">
                <div class="input-group">
                    <div class="input-field">
                        <label for="discordId" class="input-label">Discord User ID</label>
                        <input type="text" id="discordId" placeholder="e.g., 120842877046751234" />
                    </div>
                    <div class="input-field">
                        <label for="codeCount" class="input-label">Number of Codes</label>
                        <input type="number" id="codeCount" class="number-input" min="1" max="100" value="1" />
                    </div>
                </div>
                <button id="createShare" disabled>Create 10-Minute Share</button>
            </div>
        </div>

        <div class="table-controls">
            <div class="refresh-controls">
                <button id="refresh">Refresh Data</button>
                <button id="createCustomShare">Create Custom Share</button>
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="showConfirmed" style="cursor: pointer;">
                    Show Confirmed Shares
                </label>
            </div>
            <div class="group-size-control">
                <label for="groupSize" class="input-label">Group Size:</label>
                <input type="number" id="groupSize" class="number-input" min="1" value="5" />
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Discord User</th>
                    <th>Codes</th>
                    <th>Expires In</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="shareTable">
                <tr>
                    <td colspan="4">No shares yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Code Management Modal -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modalTitle">Code Management</h2>
            
            <div id="customShareFields" class="custom-share-fields" style="display: none;">
                <div class="input-field">
                    <label for="modalDiscordId" class="input-label">Discord User ID</label>
                    <input type="text" id="modalDiscordId" placeholder="e.g., 120842877046751234" />
                </div>
                <div id="modalDiscordValidation" class="validation-message"></div>
            </div>

            <div class="code-entry">
                <div class="code-entry-header">
                    <h3>Code Entry</h3>
                    <div class="code-mode-toggle">
                        <button id="addMode" class="mode-button active" onclick="switchMode('add')">Add Codes</button>
                        <button id="removeMode" class="mode-button" onclick="switchMode('remove')">Remove Codes</button>
                    </div>
                </div>

                <textarea id="codeInput" placeholder="Enter codes (one per line)..."></textarea>
                <div id="validationSummary" class="validation-summary">
                    <!-- Validation results will be shown here -->
                </div>

                <div id="codeList" class="code-list">
                    <!-- Codes will be inserted here with validation status -->
                </div>
            </div>

            <div class="share-preview">
                <div class="share-preview-header">
                    <span>Share Preview</span>
                    <span id="shareCodeCount">0 codes</span>
                </div>
                <div id="shareRanges" class="share-preview-ranges">
                    <!-- Share ranges will be shown here -->
                </div>
            </div>

            <div class="code-actions">
                <button id="saveChanges" onclick="saveChanges()">Save Changes</button>
                <button onclick="discardChanges()">Discard Changes</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { APIQueue } from './api.js';
        import { initializeCodeManagement } from './codeManagement.js';
        import { initializeUI, renderTable } from './uiComponents.js';
        import { cleanExpiredShares } from './api.js';

        // Initialize state
        const localData = { shares: [] };
        const apiQueue = new APIQueue();

        // Initialize components
        document.addEventListener("DOMContentLoaded", () => {
            initializeCodeManagement(localData, apiQueue, overwriteBasket, renderTable);
            initializeUI(localData, apiQueue, overwriteBasket, renderTable);
        });

        // Shared functions
        async function overwriteBasket(newData) {
            console.log('[Overwrite] Updating basket with:', newData);
            try {
                // Clean and validate the data before sending
                const cleanedShares = newData.shares.map(share => {
                    // Ensure all properties exist and are of correct type
                    return {
                        i: share.i || share.share_id || Date.now().toString(),
                        d: share.d || share.discord_id,
                        r: share.r || share.ranges,
                        e: share.e || share.expiration || Date.now() + SHARE_DURATION,
                        c: typeof share.c !== 'undefined' ? share.c : !!share.confirmed
                    };
                });

                const payload = { shares: cleanedShares };
                console.log('[Overwrite] Sending payload:', payload);

                const response = await apiQueue.enqueue({
                    url: `${PANTRY_URL}/basket/${BASKET_NAME}`,
                    options: {
                        method: "POST",
                        body: JSON.stringify(payload)
                    }
                });
                
                console.log("[Overwrite] Success:", "Database updated successfully");
            } catch (err) {
                console.error("[Overwrite] Error:", err);
                showFloatingMessage("Operation failed. Please try again.", 'error');
            }
        }
    </script>
</body>
</html>
