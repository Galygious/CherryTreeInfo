<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lease Test Page</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        button {
            margin: 10px 0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .error-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .floating-error {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.1);
            color: red;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            animation: floatDown 3s ease-in forwards;
            white-space: nowrap;
            pointer-events: none;
        }
        @keyframes floatDown {
            0% {
                top: 10%;
                opacity: 1;
            }
            100% {
                top: 90%;
                opacity: 0;
            }
        }
        .queue-status-container {
            height: 76px; /* Fixed height to prevent layout shifts */
            margin: 10px 0;
        }
        #queueStatus {
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        #queueStatus.visible {
            visibility: visible;
            opacity: 1;
        }
        .queue-info {
            margin: 5px 0;
            font-family: monospace;
        }
        .processing {
            color: #0066cc;
            font-weight: bold;
        }
        .queue-length {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Lease Management</h1>
    <div class="queue-status-container">
        <div id="queueStatus">
            <div class="queue-info">Queue Length: <span class="queue-length">0</span></div>
            <div class="queue-info">Processing: <span class="processing">None</span></div>
        </div>
    </div>
    <button id="createLease" disabled>Create 10-Minute Lease</button>
    <button id="refresh">Refresh Data</button>
    <table>
        <thead>
            <tr>
                <th>Lease ID</th>
                <th>Ranges</th>
                <th>Expires In</th>
            </tr>
        </thead>
        <tbody id="leaseTable">
            <tr>
                <td colspan="3">No leases yet.</td>
            </tr>
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Constants
            const PANTRY_URL = "https://getpantry.cloud/apiv1/pantry/be94921b-0a73-4c27-852f-903779cb6787";
            const BASKET_NAME = "LeaseBasket";
            const API_COOLDOWN = 3000; // 3 second cooldown between API requests
            const INITIAL_BACKOFF = 10000; // 10 second initial backoff
            const MAX_BACKOFF = 30000; // 30 second maximum backoff
            const LEASE_DURATION = 10 * 60 * 1000; // 10 minutes in milliseconds

            // DOM Elements
            const leaseButton = document.getElementById("createLease");
            const refreshButton = document.getElementById("refresh");
            const leaseTable = document.getElementById("leaseTable");
            const queueStatus = document.getElementById("queueStatus");
            const queueLengthSpan = document.querySelector(".queue-length");
            const processingSpan = document.querySelector(".processing");

            // State
            let localData = { leases: [] };

            class APIQueue {
                constructor() {
                    this.queue = [];
                    this.processing = false;
                    this.currentBackoff = INITIAL_BACKOFF;
                    this.lastRequestTime = 0;
                    this.currentAction = null;
                    this.removingExpiredLeases = false;
                }

                hasExpiredLeaseRemovalInQueue() {
                    return this.queue.some(item =>
                        item.request.options.method === 'POST' &&
                        new URL(item.request.url).pathname.includes(`/basket/${BASKET_NAME}`) &&
                        item.request.options.body
                    );
                }

                removeExpiredLeaseRequest() {
                    const index = this.queue.findIndex(item =>
                        item.request.options.method === 'POST' &&
                        new URL(item.request.url).pathname.includes(`/basket/${BASKET_NAME}`) &&
                        item.request.options.body
                    );
                    if (index !== -1) {
                        const [removed] = this.queue.splice(index, 1);
                        removed.resolve(); // Resolve the promise since we're handling it with a newer request
                        this.updateQueueDisplay();
                    }
                }

                hasRefreshInQueue() {
                    return this.queue.some(item =>
                        item.request.options.method === 'GET' &&
                        new URL(item.request.url).pathname.includes(`/basket/${BASKET_NAME}`)
                    );
                }

                getActionMessage(request) {
                    const method = request.options.method;
                    const path = new URL(request.url).pathname;
                    
                    // Convert API requests to user-friendly messages
                    if (method === 'GET') {
                        return 'Fetching leases from the database';
                    } else if (method === 'POST') {
                        return 'Updating lease database';
                    } else if (method === 'PUT') {
                        return 'Creating new lease';
                    }
                    return 'Processing request...';
                }

                updateQueueDisplay() {
                    queueLengthSpan.textContent = this.queue.length;
                    
                    // If there's a current action, show it
                    if (this.currentAction) {
                        processingSpan.textContent = this.currentAction;
                    }
                    // If no current action but items in queue, show next action
                    else if (this.queue.length > 0) {
                        processingSpan.textContent = this.getActionMessage(this.queue[0].request);
                    }
                    // If nothing in queue and not processing, show ready state
                    else {
                        processingSpan.textContent = 'Ready for next operation';
                    }

                    // Show queue status if there are items in queue or processing
                    if (this.queue.length > 0 || this.processing) {
                        queueStatus.classList.add('visible');
                    } else {
                        queueStatus.classList.remove('visible');
                    }
                }

                async enqueue(request) {
                    console.log(`[Queue] Enqueueing ${request.options.method} request to ${request.url}`);
                    console.log('[Queue] Current queue length:', this.queue.length);
                    
                    return new Promise((resolve, reject) => {
                        this.queue.push({
                            request,
                            resolve,
                            reject,
                            retryCount: 0
                        });
                        console.log('[Queue] Request added. New queue length:', this.queue.length);
                        this.updateQueueDisplay();
                        this.processQueue();
                    });
                }

                async processQueue() {
                    if (this.processing || this.queue.length === 0) {
                        console.log('[Queue] Queue processing skipped:', 
                            this.processing ? 'Already processing' : 'Queue empty');
                        if (!this.processing) {
                            this.currentAction = null;
                            this.updateQueueDisplay();
                        }
                        return;
                    }
                    
                    this.processing = true;
                    console.log('[Queue] Starting queue processing');

                    const now = Date.now();
                    const timeSinceLastRequest = now - this.lastRequestTime;
                    
                    if (timeSinceLastRequest < API_COOLDOWN) {
                        const waitTime = API_COOLDOWN - timeSinceLastRequest;
                        console.log(`[Queue] Cooldown in effect. Waiting ${waitTime}ms`);
                        // Keep showing the next action even during cooldown
                        const nextItem = this.queue[0];
                        this.currentAction = this.getActionMessage(nextItem.request);
                        this.updateQueueDisplay();
                        await this.delay(waitTime);
                    }

                    const item = this.queue[0];
                    this.currentAction = this.getActionMessage(item.request);
                    this.updateQueueDisplay();
                    
                    console.log('[Queue] Processing request:', item.request.options.method, item.request.url);
                    
                    try {
                        console.log('[API] Making request:', {
                            url: item.request.url,
                            method: item.request.options.method,
                            body: item.request.options.body
                        });

                        const response = await fetch(item.request.url, {
                            ...item.request.options,
                            headers: { "Content-Type": "application/json" }
                        });
                        
                        if (response.status === 429) {
                            console.warn(`[API] Rate limited. Backing off for ${this.currentBackoff}ms`);
                            showFloatingError(`Server is busy. Retrying in ${this.currentBackoff / 1000} seconds...`);
                            this.currentAction = `Waiting for server availability (${this.currentBackoff / 1000}s)`;
                            this.updateQueueDisplay();
                            await this.delay(this.currentBackoff);
                            
                            // Increase backoff time
                            this.currentBackoff = Math.min(this.currentBackoff + 10000, MAX_BACKOFF);
                            item.retryCount++;
                            console.log(`[Queue] Retry ${item.retryCount}. New backoff: ${this.currentBackoff}ms`);
                            
                            // Keep the item in queue for retry
                            this.processing = false;
                            this.processQueue();
                            return;
                        }

                        if (!response.ok) {
                            throw new Error(`HTTP Error: ${response.status}`);
                        }

                        // Success - reset backoff and process response
                        this.currentBackoff = INITIAL_BACKOFF;
                        const data = await response.json();
                        console.log('[API] Response:', data);
                        
                        this.queue.shift(); // Remove the processed item
                        console.log('[Queue] Request completed. Queue length:', this.queue.length);
                        
                        item.resolve(data);
                    } catch (error) {
                        console.error("[API] Error:", error);
                        showFloatingError(`Error: ${error.message}`);
                        item.reject(error);
                        this.queue.shift(); // Remove failed item
                        console.log('[Queue] Request failed. Queue length:', this.queue.length);
                    }

                    this.lastRequestTime = Date.now();
                    this.processing = false;
                    this.currentAction = null;
                    this.updateQueueDisplay();
                    console.log('[Queue] Processing complete');
                    
                    // Process next item after cooldown
                    setTimeout(() => this.processQueue(), API_COOLDOWN);
                }

                delay(ms) {
                    return new Promise(resolve => setTimeout(resolve, ms));
                }
            }

            // Initialize API Queue
            const apiQueue = new APIQueue();

            function showFloatingError(message) {
                let errorContainer = document.querySelector('.error-container');
                if (!errorContainer) {
                    errorContainer = document.createElement('div');
                    errorContainer.className = 'error-container';
                    document.body.appendChild(errorContainer);
                }

                const error = document.createElement('div');
                error.className = 'floating-error';
                error.textContent = message;
                errorContainer.appendChild(error);

                // Remove the error element after animation completes
                error.addEventListener('animationend', () => {
                    error.remove();
                    // Remove container if it's empty
                    if (errorContainer.children.length === 0) {
                        errorContainer.remove();
                    }
                });
            }

            function formatTimeLeft(milliseconds) {
                const seconds = Math.ceil(milliseconds / 1000);
                const minutes = Math.floor(seconds / 60);
                const hours = Math.floor(minutes / 60);
                const days = Math.floor(hours / 24);

                if (days > 0) {
                    const remainingHours = hours % 24;
                    const remainingMinutes = minutes % 60;
                    return `${days}d ${remainingHours}h ${remainingMinutes}m`;
                } else if (hours > 0) {
                    const remainingMinutes = minutes % 60;
                    return `${hours}h ${remainingMinutes}m`;
                } else if (minutes > 0) {
                    return `${minutes}m`;
                } else {
                    return `${seconds}s`;
                }
            }

            async function fetchBasket() {
                console.log('[Fetch] Getting basket contents');
                
                // Check if there's already a refresh in queue
                if (apiQueue.hasRefreshInQueue()) {
                    console.log('[Fetch] Refresh already queued, skipping');
                    showFloatingError("Refresh already in progress...");
                    return;
                }

                try {
                    const data = await apiQueue.enqueue({
                        url: `${PANTRY_URL}/basket/${BASKET_NAME}`,
                        options: {
                            method: "GET"
                        }
                    });

                    console.log('[Fetch] Current basket data:', data);
                    const cleanedData = cleanExpiredLeases(data);
                    console.log('[Fetch] Cleaned data:', cleanedData);
                    
                    if (cleanedData.updated) {
                        console.log('[Fetch] Expired leases found, updating basket');
                        await overwriteBasket(cleanedData.data);
                    }

                    localData = cleanedData.data;
                    renderTable(localData.leases);
                    leaseButton.disabled = false;
                } catch (err) {
                    console.error("[Fetch] Error:", err);
                }
            }

            function cleanExpiredLeases(data) {
                const now = Date.now();
                if (data === null || typeof data !== 'object') {
                    data = { leases: [] };
                }
                if (!('leases' in data)) {
                    data.leases = [];
                }
                const originalLeases = Array.isArray(data.leases) ? data.leases : [];
                const validLeases = originalLeases.filter(lease => lease.expiration > now);
                
                const expiredCount = originalLeases.length - validLeases.length;
                if (expiredCount > 0) {
                    console.log('[Clean] Found expired leases:', expiredCount);
                }

                return {
                    updated: expiredCount > 0,
                    data: { ...data, leases: validLeases }
                };
            }

            async function overwriteBasket(newData) {
                console.log('[Overwrite] Updating basket with:', newData);
                try {
                    await apiQueue.enqueue({
                        url: `${PANTRY_URL}/basket/${BASKET_NAME}`,
                        options: {
                            method: "POST",
                            body: JSON.stringify(newData)
                        }
                    });
                    console.log("[Overwrite] Basket updated successfully");
                } catch (err) {
                    console.error("[Overwrite] Error:", err);
                }
            }

            async function createLease() {
                console.log('[Create] Creating new 10-minute lease');
                leaseButton.disabled = true;
                showFloatingError("Creating new lease...");

                const newLease = {
                    lease_id: `lease_${Date.now()}`,
                    ranges: [[10000000, 10000001]],
                    expiration: Date.now() + LEASE_DURATION,
                };

                console.log('[Create] New lease:', newLease);

                try {
                    // Only send the new lease for the PUT request since it's an append operation
                    await apiQueue.enqueue({
                        url: `${PANTRY_URL}/basket/${BASKET_NAME}`,
                        options: {
                            method: "PUT",
                            body: JSON.stringify({ leases: [newLease] })
                        }
                    });
                    console.log("[Create] Lease added successfully");
                    localData.leases.push(newLease);
                } catch (err) {
                    console.error("[Create] Error:", err);
                }

                leaseButton.disabled = false;
                renderTable(localData.leases);
            }

            function renderTable(leases) {
                leases = Array.isArray(leases) ? leases : [];
                if (!leaseTable) {
                    console.error("[Render] Error: leaseTable element not found in the DOM.");
                    return;
                }

                leaseTable.innerHTML = leases.length
                    ? leases.map(lease => {
                        const timeLeft = Math.max(0, lease.expiration - Date.now());
                        return `
                            <tr>
                                <td>${lease.lease_id}</td>
                                <td>${lease.ranges.map(range => `[${range[0]}, ${range[1]}]`).join(", ")}</td>
                                <td>${formatTimeLeft(timeLeft)}</td>
                            </tr>
                        `;
                    }).join("")
                    : `<tr><td colspan="3">No leases yet.</td></tr>`;
            }

            async function removeExpiredLeases() {
                // Skip if we're already processing expired leases
                if (apiQueue.removingExpiredLeases) return;

                const now = Date.now();
                if (!Array.isArray(localData.leases)) {
                    localData.leases = [];
                    return;
                }

                const expiredLeases = localData.leases.filter(lease => lease.expiration <= now);
                if (expiredLeases.length === 0) return;

                console.log('[Remove] Found expired leases:', expiredLeases.length);
                const validLeases = localData.leases.filter(lease => lease.expiration > now);
                localData.leases = validLeases;
                renderTable(localData.leases);

                // If there's already a request to remove expired leases, remove it as this one will handle those changes
                if (apiQueue.hasExpiredLeaseRemovalInQueue()) {
                    apiQueue.removeExpiredLeaseRequest();
                }

                // Mark that we're processing expired leases
                apiQueue.removingExpiredLeases = true;

                try {
                    await apiQueue.enqueue({
                        url: `${PANTRY_URL}/basket/${BASKET_NAME}`,
                        options: {
                            method: "POST",
                            body: JSON.stringify({ leases: validLeases })
                        }
                    });
                } catch (err) {
                    console.error("[Remove] Error:", err);
                } finally {
                    // Clear the flag when we're done
                    apiQueue.removingExpiredLeases = false;
                }
            }

            // Event listeners
            leaseButton.addEventListener("click", createLease);
            refreshButton.addEventListener("click", fetchBasket);

            // Initialize page
            console.log('[Init] Starting application');
            fetchBasket();

            // Timer update loop
            setInterval(() => {
                renderTable(localData.leases);
                removeExpiredLeases();
            }, 1000);
        });
    </script>
</body>
</html>
